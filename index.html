function wrap(text,maxW,maxLines){if(mw(text)<=maxW)return[text];const ws=text.split(/\s+/).filter(Boolean);let best=null;
 for(let k=2;k<=maxLines&&!best;k++)(function rec(start,parts){if(parts.length===k-1){if(start>=ws.length)return;const all=parts.concat([ws.slice(start).join(' ')]);const m=Math.max(...all.map(mw));if(m<=maxW&&(!best||m<best.m))best={m,all};return}
  for(let e=start+1;e<ws.length;e++)rec(e,parts.concat([ws.slice(start,e).join(' ')]))})(0,[]);

 if(lines.length>maxLines){lines.length=maxLines;let l=lines[maxLines-1];while(l&&mw(l+'…')>maxW)l=l.slice(0,-1);lines[maxLines-1]=l+'…'}return lines}

    g.fillStyle='#fff';g.font='700 28px '+F;g.textAlign='center';g.fillText(fit(c.t,iw-24),ix+iw/2,iy+ih-20)}}
  else{g.fillStyle=c.t?T.tint:T.empty;g.fillRect(ix,iy,iw,ih);
   if(c.t){g.fillStyle='#1b2340';g.font='700 36px '+F;g.textAlign='center';const L=wrap(c.t,iw-36,3),lh2=48,sy=iy+ih/2-(L.length-1)*lh2/2+13;L.forEach((l,k)=>g.fillText(l,ix+iw/2,sy+k*lh2))}}
  g.restore();
  g.fillStyle=T.lab;g.font='700 27px '+F;g.textAlign='left';g.fillText(fit(c.q,CW-PAD*2-4),x+PAD+4,y+CH-17)});
 g.textAlign='center';g.fillStyle=T.sub;g.globalAlpha=.7;g.font='500 26px '+F;g.fillText('연말결산 메이커 × 루미 오락실 · @lumimori38',W/2,H-34);g.globalAlpha=1;
 $('prevImg').src=cv.toDataURL('image/png');
 shareBlob=null;cv.toBlob(bl=>{if(my===drawSeq)shareBlob=bl},'image/png');
}

const ua=navigator.userAgent,isIOS=/iP(hone|ad|od)/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),
 inApp=/KAKAOTALK|Instagram|FBAN|FBAV|Twitter|Line\/|NAVER|DaumApps/i.test(ua),framed=(()=>{try{return window.self!==window.top}catch(e){return true}})();
function flash(btn,txt){const o=btn.dataset.o||btn.textContent;btn.dataset.o=o;btn.textContent=txt;clearTimeout(btn._t);btn._t=setTimeout(()=>btn.textContent=o,1500)}
function tip(btn,txt){btn.querySelectorAll('.tip').forEach(t=>t.remove());const t=document.createElement('span');t.className='tip';t.textContent=txt;btn.appendChild(t);setTimeout(()=>t.remove(),2000)}
$('saveBtn').onclick=async()=>{await draw();const url=cv.toDataURL('image/png');
 if(isIOS||inApp||framed){$('ovImg').src=url;$('saveov').classList.add('on');return}
 const a=document.createElement('a');a.href=url;a.download='연말결산-'+YEAR+'.png';document.body.appendChild(a);a.click();a.remove();flash($('saveBtn'),'저장했어요!')};
$('ovClose').onclick=()=>$('saveov').classList.remove('on');
function shareText(){return '[연말결산 메이커] '+YEAR+' '+S.title+'\n\n🔗 '+URL_+'\n#연말결산메이커 #연말결산 #루미오락실'}
async function copy(t){try{await navigator.clipboard.writeText(t);return true}catch(e){}
 try{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);const ok=document.execCommand('copy');ta.remove();return ok}catch(e){return false}}
$('shareBtn').onclick=()=>{const b=$('shareBtn'),t=shareText();
 const file=shareBlob?new File([shareBlob],'연말결산-'+YEAR+'.png',{type:'image/png'}):null;
 copy(t);
 if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
  navigator.share({files:[file],text:t}).then(()=>tip(b,'문구가 안 들어갔다면 붙여 넣어 주세요')).catch(()=>{});return}
 const a=document.createElement('a');a.href='https://x.com/intent/tweet?text='+encodeURIComponent(t);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
 tip(b,'이미지는 저장해서 첨부해 주세요')};

function ask(msg,sub,no,yes,onYes,onNo){$('mMsg').textContent=msg;$('mSub').textContent=sub;$('mNo').textContent=no;$('mYes').textContent=yes;$('modal').classList.add('on');
 $('mYes').onclick=()=>{$('modal').classList.remove('on');onYes&&onYes()};$('mNo').onclick=()=>{$('modal').classList.remove('on');onNo&&onNo()}}

S=load();renderStart();
